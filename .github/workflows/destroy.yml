name: Destroy

on:
  schedule:
    # Nightly, so a lab left running overnight is a bug that fixes itself.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type destroy to confirm.'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Remove every object this lab created
    runs-on: ubuntu-latest
    environment: lab
    steps:
      - name: Check the confirmation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm != 'destroy' }}
        run: |
          echo "Confirmation was '${{ inputs.confirm }}', expected 'destroy'."
          exit 1

      - uses: actions/checkout@v7

      - name: Mask identifiers
        run: |
          echo "::add-mask::${{ secrets.AZURE_TENANT_ID }}"
          echo "::add-mask::${{ secrets.AZURE_CLIENT_ID }}"

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Remove every object this lab creates
        run: ./scripts/reset-lab-directory.sh

      # The step above reporting success is not the same as the directory being
      # clean, so the state is read back from a separate set of calls. That
      # matters: on the run this check was written for, the deletion reported
      # success and a Conditional Access policy was still listed afterwards.
      #
      # Deletion is eventually consistent, so this polls rather than reading
      # once -- but it is still a check that fails. Retrying forever, or
      # treating a timeout as good enough, would turn it into the kind of
      # reassurance that reports clean over a full directory.
      - name: Confirm the directory is clean
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $deadline = (Get-Date).AddMinutes(3)
          $attempt = 0

          while ($true) {
            $attempt++

            $policies = az rest --method GET `
              --url 'https://graph.microsoft.com/v1.0/identity/conditionalAccess/policies?$select=id,displayName' |
              ConvertFrom-Json
            $left = @($policies.value | Where-Object { $_.displayName -like 'cutover*' })

            $users = @(az ad user list --filter "startswith(displayName,'cutover-')" --query "[].displayName" -o json | ConvertFrom-Json)
            $groups = @(az ad group list --filter "startswith(displayName,'cutover-')" --query "[].displayName" -o json | ConvertFrom-Json)

            $total = $left.Count + $users.Count + $groups.Count
            if ($total -eq 0) {
              Write-Host "The directory is clean, confirmed on read $attempt."
              break
            }

            if ((Get-Date) -ge $deadline) {
              $left | ForEach-Object { Write-Host "  policy: $($_.displayName)" }
              $users | ForEach-Object { Write-Host "  user: $_" }
              $groups | ForEach-Object { Write-Host "  group: $_" }
              throw "The directory still holds $total object(s) this lab created, three minutes after they were deleted."
            }

            Write-Host "still listed: $($left.Count) policy, $($users.Count) user(s), $($groups.Count) group(s) - deletion is eventually consistent, re-reading (attempt $attempt)"
            Start-Sleep -Seconds 15
          }
