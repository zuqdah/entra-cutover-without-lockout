name: Destroy

on:
  schedule:
    # Nightly, so a lab left running overnight is a bug that fixes itself.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type destroy to confirm.'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Remove every object this lab created
    runs-on: ubuntu-latest
    environment: lab
    steps:
      - name: Check the confirmation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm != 'destroy' }}
        run: |
          echo "Confirmation was '${{ inputs.confirm }}', expected 'destroy'."
          exit 1

      - name: Mask identifiers
        run: |
          echo "::add-mask::${{ secrets.AZURE_TENANT_ID }}"
          echo "::add-mask::${{ secrets.AZURE_CLIENT_ID }}"

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Teardown deletes by name prefix rather than from Terraform state, and
      # that is deliberate. This lab keeps no remote state, so a state-based
      # destroy in a fresh runner would find nothing to do and report success
      # over a directory that still holds every object. Deleting by prefix also
      # catches anything created by hand in the portal, which a state-based
      # destroy would leave behind by definition.
      - name: Remove every object this lab creates
        run: |
          set -euo pipefail
          removed=0

          for kind in users groups; do
            while read -r id; do
              [ -z "$id" ] && continue
              az rest --method DELETE --url "https://graph.microsoft.com/v1.0/$kind/$id"
              echo "removed $kind/$id"
              removed=$((removed + 1))
            done < <(az rest --method GET \
              --url "https://graph.microsoft.com/v1.0/$kind?\$select=id,displayName" \
              --query "value[?starts_with(displayName,'cutover')].id" -o tsv)
          done

          # The policies URL below is single-quoted on purpose. $select is an
          # OData parameter and has to reach Graph literally; letting the shell
          # expand it sends an empty select and changes what comes back.
          while read -r id; do
            [ -z "$id" ] && continue
            az rest --method DELETE --url "https://graph.microsoft.com/v1.0/identity/conditionalAccess/policies/$id"
            echo "removed policy/$id"
            removed=$((removed + 1))
          done < <(az rest --method GET \
            --url 'https://graph.microsoft.com/v1.0/identity/conditionalAccess/policies?$select=id,displayName' \
            --query "value[?starts_with(displayName,'cutover')].id" -o tsv)

          echo "removed $removed object(s)."

      # The deletion step above reporting success is not the same as the
      # directory being clean: a DELETE can be accepted and still leave the
      # object, and a Conditional Access policy left behind in a tenant is the
      # kind of leftover that locks someone out months later. So the state is
      # read back independently of the calls that changed it.
      - name: Confirm the directory is clean
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $policies = az rest --method GET `
            --url 'https://graph.microsoft.com/v1.0/identity/conditionalAccess/policies?$select=id,displayName' |
            ConvertFrom-Json
          $left = @($policies.value | Where-Object { $_.displayName -like 'cutover *' })

          $users = az ad user list --filter "startswith(displayName,'cutover-')" --query "[].displayName" -o json | ConvertFrom-Json
          $groups = az ad group list --filter "startswith(displayName,'cutover-')" --query "[].displayName" -o json | ConvertFrom-Json

          Write-Host "policies left: $($left.Count), users left: $(@($users).Count), groups left: $(@($groups).Count)"

          if ($left.Count -or @($users).Count -or @($groups).Count) {
            $left | ForEach-Object { Write-Host "  policy: $($_.displayName)" }
            $users | ForEach-Object { Write-Host "  user: $_" }
            $groups | ForEach-Object { Write-Host "  group: $_" }
            throw 'The directory still holds objects this lab created.'
          }

          Write-Host 'The directory is clean.'
